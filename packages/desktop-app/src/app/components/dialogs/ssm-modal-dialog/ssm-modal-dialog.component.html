<a class="close-modal" (click)="closeModal();"><i class="moon-Close"></i></a>
<h4>{{session.sessionName}}</h4>
<h5>{{session | detail }}</h5>

<div class="ssm-tray-form">

  <div class="form-container">
    <div class="form-group">
      <div class="form-field">
        <div class="form-group">
          <label>Select a Region</label>
          <ng-select bindLabel="region" bindValue="region" groupBy="group" [items]="awsRegions" [(ngModel)]="selectedSsmRegion"
                     placeholder="Select a Region for Finding Instances" (change)="changeSsmRegion();"
                     [appendTo]="'body'"></ng-select>
        </div>
      </div>
    </div>

    <div class="loader" *ngIf="ssmLoading"><i class="fa fa-spinner fa-spin"></i></div>

    <div class="list-of-ssm" *ngIf="!ssmLoading">
      <ng-container *ngIf="!ssmLoading && !askingSsmRegion">
        <div class="form-group">
          <div class="form-field">
            <div class="form-group">
              <label>Select an Instance</label>
              <input spellcheck="false" class="form-control" type="text" placeholder="Search Instances..." (keyup)="searchSSMInstance($event)"/>
            </div>
          </div>
        </div>
      </ng-container>

      <ul class="ssm-ul" *ngIf="instances.length > 0">
        <li *ngFor="let instance of instances" class="ssm-card">
          <div class="ssm-card-row">
            <span class="ssm-instance"><b>{{instance.Name.length >= 24 ? instance.Name.substr(0, 21) + '...' : instance.Name}}</b> - {{instance.IPAddress}}</span>
            <button class="btn-control btn-sm toggle-button {{forwardingInstanceId === instance.InstanceId ? 'toggled' : ''}}"
                    (click)="togglePortForwarding(instance.InstanceId)">Forward Port</button>
            <button class="btn-control btn-sm" (click)="startSsmSession(instance.InstanceId)">
              <i class="fa fa-spinner fa-spin" *ngIf="instance.loading"></i>
              <span *ngIf="!instance.loading">Connect</span>
            </button>
          </div>

          <form class="port-forwarding" *ngIf="forwardingInstanceId === instance.InstanceId" (ngSubmit)="startPortForwarding(instance.InstanceId)">
            <div class="port-forwarding-fields">
              <label class="remote-host">Remote Host
                <input class="form-control" name="remoteHost" [(ngModel)]="forwarding.remoteHost" spellcheck="false"
                       placeholder="This instance, or e.g. a database endpoint"/>
              </label>
              <label>Remote Port
                <input class="form-control" name="remotePort" [(ngModel)]="forwarding.remotePort" inputmode="numeric" placeholder="5432"/>
              </label>
              <label>Local Port
                <input class="form-control" name="localPort" [(ngModel)]="forwarding.localPort" inputmode="numeric" placeholder="Same as remote"/>
              </label>
            </div>
            <p class="port-forwarding-message {{forwardingMessage.error ? 'error' : ''}}" *ngIf="forwardingMessage">{{forwardingMessage.text}}</p>
            <button type="submit" class="btn-control btn-sm">Start Forwarding</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</div>

<div class="sidebar-flex">
<mat-list>
  <mat-list-item class="workspace-menu">
    <div mat-line class="workspace-menu-line">
      <div class="workspace-icon-container local">
        <i class="moon-Home"></i>
      </div>
      <span class="workspace-name">Local Workspace</span>
    </div>
  </mat-list-item>
  <mat-list-item (click)="resetFilters();" class="counted-item {{this.showAll ? 'selected-segment' : ''}}">
    <div mat-line><i class="moon-Row"></i> <span>All Sessions</span>
      <span class="sidebar-count" *ngIf="activeSessions > 0" matTooltip="Active sessions">{{activeSessions}}</span></div>
  </mat-list-item>
  <mat-list-item (click)="showOnlyPinned();" class="{{this.showPinned ? 'selected-segment' : ''}}">
    <div mat-line><i class="moon-Pin"></i> <span>Pinned</span></div>
  </mat-list-item>
  <mat-list-item (click)="showTunnelsView();" class="counted-item {{this.showTunnels ? 'selected-segment' : ''}}">
    <div mat-line><i class="moon-Server"></i> <span>Tunnels</span>
      <span class="sidebar-count" *ngIf="runningTunnels > 0" matTooltip="Running tunnels">{{runningTunnels}}</span></div>
  </mat-list-item>
  <div class="space-between-mat-lists"></div>
  <app-integration-bar></app-integration-bar>
  <div class="space-between-mat-lists"></div>
  <mat-accordion>
    <mat-expansion-panel [expanded]="true">
      <mat-expansion-panel-header>
        <mat-panel-title>
          <div mat-subheader><span>Saved Filters</span><i class="moon-Caret-down"></i></div>
        </mat-panel-title>
      </mat-expansion-panel-header>

      <mat-list-item [disableRipple]="true" *ngFor="let segment of segments" [ngClass]="selectedSegmentCheck(segment)"
                     (click)="applySegmentFilter(segment, $event);">
        <div mat-line class="visible-option-menu segment-row"><i class="moon-Tag"></i> <span>{{segment.name}}</span><i class="moon-Close"
                                                                                                                       (click)="showConfirmationDialog(segment, $event)"></i>
        </div>
      </mat-list-item>

    </mat-expansion-panel>
  </mat-accordion>
</mat-list>
</div>

name: Release

# Push a tag like v1.2.3 on master to publish a GitHub Release with the macOS build.
# The tag must match packages/desktop-app/package.json and have a "## 1.2.3" entry in CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag, app version and changelog agree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./packages/desktop-app/package.json').version")
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $APP_VERSION"
            exit 1
          fi
          if ! grep -q "^## $VERSION " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' entry"
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build-macos.yml
    with:
      notarize: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - name: Write release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Install

          With Homebrew: \`brew install --cask sergioarojasm98/tap/freeleapp\`. Or download \`Freeleapp-$VERSION-arm64.dmg\` (Apple Silicon) and drag Freeleapp to Applications. The app is signed with a Developer ID and notarized by Apple, and it updates itself.

          Full documentation: https://freeleapp.com
          EOF
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Freeleapp $VERSION" \
            --notes-file notes.md

  # Points the cask in sergioarojasm98/homebrew-tap at the new dmg; the tap's CI then installs it
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - uses: actions/checkout@v7
        with:
          repository: sergioarojasm98/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the cask
        working-directory: tap
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "../dist/Freeleapp-$VERSION-arm64.dmg" | cut -d' ' -f1)
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/freeleapp.rb
          git diff
          if git diff --quiet; then
            echo "The cask already points at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: freeleapp $VERSION"
          git push

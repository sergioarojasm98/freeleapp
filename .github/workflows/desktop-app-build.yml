name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the app, as a release does
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Branches of this repository are already built on push; only pull requests from forks run here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: npm install

      - name: Build and test core
        working-directory: packages/core
        run: |
          npm install
          npm run build
          npx jest

      # Native modules and the Electron binary are not needed for the Angular unit tests
      - name: Install desktop app dependencies
        working-directory: packages/desktop-app
        run: npm install --ignore-scripts

      - name: Test desktop app
        working-directory: packages/desktop-app
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

  build-macos-arm64:
    # Branches of this repository are already built on push; only pull requests from forks run here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/build-macos.yml
    with:
      notarize: ${{ inputs.notarize == true }}
    # Developer ID signature; GitHub passes no secrets to pull requests from forks, which get an ad-hoc build
    secrets: inherit

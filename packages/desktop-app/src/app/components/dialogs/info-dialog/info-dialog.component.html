<div class="mat-tab-labels updater-header">
  <div class="modal-title">
    <div class="modal-title-message">
      <span>{{title}}</span>
    </div>
    <div class="modal-title-close">
      <a class="close pull-right" aria-label="Close" (click)="close();">
        <span aria-hidden="true"><i class="moon-Close"></i></span>
      </a>
    </div>
  </div>
</div>

<div class="modal-body text-center updater">

  <br>
  <div class="html-content" [innerHTML]="description" (click)="$event.preventDefault();manageLinkEvents($event)"></div>
  <br>

  <!-- Only notifications with a link need an action; the X and Esc already close the dialog -->
  <div class="button-equalizer" *ngIf="link">
    <button type="button" (click)="closeAndOpenLink();" class="enabled">{{buttonName ?? 'Open'}}</button>
  </div>

</div>
